# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name automated-jobs.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name automated-jobs.com;

    ssl_certificate /etc/letsencrypt/live/automated-jobs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automated-jobs.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
t
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    location /media/ {
        alias /app/media/;
    }
}